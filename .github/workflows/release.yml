name: Build and Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows x86_64 (单文件纯静态打包)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: NovaOps-Pro-Windows-x64.zip
            binary_name: NovaOps管理系统.exe

          # 2. macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: NovaOps-Pro-macOS-AppleSilicon.tar.gz
            binary_name: gpui-admin-demo

          # 3. macOS Intel x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: NovaOps-Pro-macOS-Intel.tar.gz
            binary_name: gpui-admin-demo

          # 4. Linux x86_64 (Ubuntu / Debian / CentOS / Fedora)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: NovaOps-Pro-Linux-x64.tar.gz
            binary_name: gpui-admin-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux 系统必要构建依赖安装 (Wayland / X11 / Fontconfig / Vulkan)
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libfontconfig1-dev libfreetype6-dev libasound2-dev libssl-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # 打包 Windows 产物
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/gpui-admin-demo.exe -DestinationPath ${{ matrix.artifact_name }}

      # 打包 macOS 产物
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release gpui-admin-demo

      # 打包 Linux 产物
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release gpui-admin-demo

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
